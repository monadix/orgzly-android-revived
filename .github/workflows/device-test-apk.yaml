name: Device test APK

on:
  push:
    branches:
      - 'ci/fuzzy-link-device-build'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Build unsigned F-Droid debug APK
        run: ./gradlew assembleFdroidDebug

      - name: Upload F-Droid debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orgzly-revived-fdroid-debug-${{ github.sha }}
          path: app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error

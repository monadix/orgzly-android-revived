name: Device test APK

on:
  push:
    branches:
      - 'ci/fuzzy-link-device-build'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Restore device-test signing key
        env:
          DEVICE_TEST_KEYSTORE_BASE64: ${{ secrets.DEVICE_TEST_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$DEVICE_TEST_KEYSTORE_BASE64" ]]; then
            umask 077
            mkdir -p "$HOME/.android"
            printf '%s' "$DEVICE_TEST_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          fi

      - name: Build F-Droid debug APK
        run: ./gradlew assembleFdroidDebug

      - name: Name the APK for distribution
        run: |
          apk=(app/build/outputs/apk/fdroid/debug/*.apk)
          if [[ ${#apk[@]} -ne 1 || ! -f "${apk[0]}" ]]; then
            echo "::error::Expected a single F-Droid debug APK"
            exit 1
          fi
          cp "${apk[0]}" orgzly-revived-fdroid-debug.apk

      - name: Upload F-Droid debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orgzly-revived-fdroid-debug-${{ github.sha }}
          path: orgzly-revived-fdroid-debug.apk
          if-no-files-found: error
          overwrite: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download F-Droid debug APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orgzly-revived-fdroid-debug-${{ github.sha }}

      - name: Publish device-test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="device-test-${GITHUB_RUN_NUMBER}"
          if draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$draft" == true ]]; then
              gh release upload "$tag" orgzly-revived-fdroid-debug.apk --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
            fi
            exit 0
          fi

          gh release create "$tag" orgzly-revived-fdroid-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Device test APK #${GITHUB_RUN_NUMBER}" \
            --prerelease \
            --latest=false \
            --notes "F-Droid debug APK for device testing. Source commit: $GITHUB_SHA."
